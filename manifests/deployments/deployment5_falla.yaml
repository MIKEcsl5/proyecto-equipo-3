# TEST 5: K8sReadOnlyRootFS - Pod SIN readOnly filesystem (DEBE FALLAR)
apiVersion: v1
kind: Pod
metadata:
  name: test-no-readonly-fs
  namespace: default
  labels:
    app: myapp
    environment: production
    owner: team-devops
    version: v1.0.0
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:latest
    securityContext:
      runAsUser: 1000
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
