# TEST 3c: K8sRequiredLabels - Label con valor inválido (DEBE FALLAR)
apiVersion: v1
kind: Pod
metadata:
  name: test-invalid-label-value
  namespace: default
  labels:
    app: myapp
    environment: testing  # No cumple regex (dev|staging|production)
    owner: team-devops
    version: v1.2.3
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:latest
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
