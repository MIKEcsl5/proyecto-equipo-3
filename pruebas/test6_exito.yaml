# TEST 6b: K8sBlockHostPath - Pod SIN hostPath (DEBE PASAR)
apiVersion: v1
kind: Pod
metadata:
  name: test-without-hostpath
  namespace: default
  labels:
    app: myapp
    environment: production
    owner: team-devops
    version: v1.0.0
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:latest
    securityContext:
      runAsUser: 1000
      readOnlyRootFilesystem: true
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    volumeMounts:
    - name: cache-volume
      mountPath: /cache
  volumes:
  - name: cache-volume
    emptyDir: {}
