# TEST: Pod CON el label correcto (DEBE PASAR)
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-with-label
  namespace: default
  labels:
    app: test
    network-policy: enabled
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:latest
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
