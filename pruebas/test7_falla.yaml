# TEST 7: K8sSecurityContext - Pod SIN securityContext (DEBE FALLAR)
apiVersion: v1
kind: Pod
metadata:
  name: test-no-security-context
  namespace: default
  labels:
    app: myapp
    environment: production
    owner: team-devops
    version: v1.0.0
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:latest
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"

