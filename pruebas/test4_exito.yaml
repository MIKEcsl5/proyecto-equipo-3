# TEST 4b: K8sPrivilegedContainers - Pod NO privilegiado (DEBE PASAR)
apiVersion: v1
kind: Pod
metadata:
  name: test-not-privileged
  namespace: default
  labels:
    app: myapp
    environment: production
    owner: team-devops
    version: v1.0.0
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:latest
    securityContext:
      privileged: false
      runAsUser: 1000
      readOnlyRootFilesystem: true
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
