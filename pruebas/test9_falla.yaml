# TEST: Pod SIN el label requerido (DEBE FALLAR)
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-no-label
  namespace: default
  labels:
    app: test
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:latest
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
