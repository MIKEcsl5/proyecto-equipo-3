# TEST 1b: K8sRequiredResources - Pod CON recursos (DEBE PASAR)
apiVersion: v1
kind: Pod
metadata:
  name: test-with-resources
  namespace: default
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:latest
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
